name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --no-fail-fast

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install "maturin>=1,<2" pytest
      - run: cargo check --locked --features python-extension
      - run: maturin build --locked --features python-test-support --out target/wheels
      - run: python -m pip install --force-reinstall target/wheels/nfs_rs-*.whl
      - run: NFS_RS_TEST_INSTALLED=1 python -m pytest -q python/tests
