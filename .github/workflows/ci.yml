name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --no-fail-fast

  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install "maturin>=1,<2" mypy pytest
      - run: cargo check --locked --features python-extension
      - run: maturin build --locked --features python-test-support --out target/wheels
      - run: python -m pip install --force-reinstall target/wheels/nfs_rs-*.whl
      - run: >-
          python -m mypy.stubtest nfs_rs --ignore-missing-stub
          --allowlist python/stubtest-allowlist.txt
      - run: NFS_RS_TEST_INSTALLED=1 python -m pytest -q python/tests
        env:
          NFS_RS_CONTRACT_ENVIRONMENT: github-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}
          NFS_RS_TEST_SEED: "0"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-failure-${{ matrix.python-version }}-${{ runner.arch }}
          path: target/python-failure-artifacts/
          if-no-files-found: warn

  python-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.13.0"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install "maturin>=1,<2"
      - run: >-
          maturin build --release --locked --compatibility manylinux2014 --zig
          --out target/python-artifacts
      - run: >-
          python scripts/verify-python-artifacts.py
          --wheel target/python-artifacts/*_x86_64.whl
      - run: python -m pip install --force-reinstall --no-deps target/python-artifacts/*.whl
      - run: python -c "import importlib.metadata, nfs_rs; assert nfs_rs.__version__ == importlib.metadata.version('nfs-rs')"
      - run: maturin sdist --out target/python-artifacts
      - run: >-
          python scripts/verify-python-artifacts.py
          --sdist target/python-artifacts/nfs_rs-*.tar.gz
      - run: mkdir -p target/sdist-source target/sdist-wheel
      - run: tar -xzf target/python-artifacts/nfs_rs-*.tar.gz -C target/sdist-source
      - run: >-
          maturin build --release --locked --features python-test-support
          --compatibility manylinux2014 --zig
          --manifest-path target/sdist-source/nfs_rs-*/Cargo.toml
          --out target/sdist-wheel
      - run: python -m pip install --force-reinstall --no-deps target/sdist-wheel/*.whl
      - run: python scripts/smoke-python-artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-x86_64
          path: target/python-artifacts/
