name: Claude (Reviewer)

# Reviewer 角色：PR 创建或更新时自动触发，Claude 按项目规范审查 diff 并留 review 评论。
# contents: read 从机制上禁止 reviewer 改代码，与实现者角色彻底分离；
# 放开的 Bash 仅限 gh pr comment/diff/view，只够发评论、读 PR，不能改代码。
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read         # 只读 —— 从机制上禁止 reviewer 改代码
      pull-requests: write   # 留 review 评论
      id-token: write        # v1 Action 走 OIDC 交换 GitHub App token，必需（不授予代码写权限）
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress 启用 review 流程：建跟踪评论 + 注入完整 PR 上下文
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            你是本仓库（nfs-rs，纯 Rust NFS 客户端库）的资深 Rust 代码审查者（与提交者是不同角色）。审查本 PR 的 diff，重点：
            1. 正确性：逻辑错误、错误处理路径、并发/async 竞态、XDR 编解码边界。
            2. 协议正确性：凡涉及 NFS 协议行为、字段语义、错误码、状态机，必须对照 RFC 核对（NFSv3=RFC 1813，NFSv4.0=RFC 7530，NFSv4.1/pNFS/Sessions=RFC 5661，NFSv4.2=RFC 7862/7863，ONC RPC=RFC 5531，XDR=RFC 4506），不得凭经验推断。
            3. 项目规范（CLAUDE.md）：禁止 unwrap/expect（测试代码除外）；use 语句集中文件顶部、表达式内路径≤三层；错误类型用 thiserror 结构化定义，不得 Box<dyn Error>/String 兜底；重构只改结构不改语义。
            4. 高性能 IO/async：数据传输用 Bytes/BytesMut 零拷贝、禁 Vec<u8> clone；共享计数用 Atomic、禁 Mutex<u64>；async 中禁同步 IO、CPU 密集走 spawn_blocking；禁 unbounded channel。

            对具体问题用 inline 评论逐行指出；整体观察或无问题用顶层评论说明。全部用中文。
          # 显式放开发评论 / 读 PR 的工具（默认不含）；这些是 reviewer 唯一需要的写操作
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
