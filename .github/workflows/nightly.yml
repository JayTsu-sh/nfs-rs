name: Nightly lab

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrasync-lab
  cancel-in-progress: false

jobs:
  nfs:
    runs-on: [self-hosted, linux, x64, terrasync-lab, nfs-rs]
    timeout-minutes: 120
    env:
      RUN_ID: nightly-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - name: Allocate unique NFSv4.0 evidence directory
        run: echo "NFS_RS_LAB_V40_EVIDENCE_DIR=$RUNNER_TEMP/nfsv40-evidence-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - run: tests/lab/health-check.sh
      - name: Collect read-only lab capability report
        run: tests/lab/capability-report.sh "$RUNNER_TEMP/nfs41-capabilities"
      - name: Upload lab capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfs41-lab-capabilities-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nfs41-capabilities
      - name: Discover persisted Rust toolchain
        run: |
          toolchain_bin=""
          for candidate in \
            "${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.95.0-x86_64-unknown-linux-gnu/bin" \
            "/home/github-runner/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu/bin" \
            "/opt/rust/1.95.0/bin"; do
            if [[ -x "$candidate/rustc" && -x "$candidate/cargo" ]]; then
              toolchain_bin="$candidate"
              break
            fi
          done
          if [[ -z "$toolchain_bin" ]]; then
            echo "complete pre-provisioned Rust 1.95.0 toolchain not found" >&2
            exit 1
          fi
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          echo "using pre-provisioned toolchain at $toolchain_bin"
      - name: Use pre-provisioned Rust 1.95.0
        run: |
          rustc --version | grep -q '^rustc 1\.95\.0 '
          rustc --version --verbose
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build and install the Python conformance wheel
        run: |
          python -m pip install "maturin>=1,<2"
          mkdir -p "$RUNNER_TEMP/python-conformance-wheel"
          maturin build --locked --out "$RUNNER_TEMP/python-conformance-wheel"
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/python-conformance-wheel/*.whl
      - run: tests/lab/prepare-run.sh "$RUN_ID"
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock cargo test --all-targets --no-fail-fast
      - name: Validate reliability coverage manifest
        run: cargo test --locked --test reliability_coverage -- --nocapture
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-e2e.sh "$RUN_ID"
      - name: Linux kernel NFSv4.0 E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-kernel-v40-e2e.sh "$RUN_ID"
      - name: DXN NFSv4.0 E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-dxn-v40-e2e.sh "$RUN_ID"
      - name: Record complete NetApp NFSv4.0 release matrix
        run: tests/lab/run-netapp-v40-release-matrix.sh "$RUN_ID" "$NFS_RS_LAB_V40_EVIDENCE_DIR"
      - name: Collect NFSv4.0 release evidence
        if: always()
        run: tests/lab/collect-nfsv40-release-evidence.sh "$RUN_ID" "$RUNNER_TEMP/nfsv40-release-evidence"
      - name: Upload NFSv4.0 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsv40-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nfsv40-release-evidence
      - name: NetApp NFSv4.1 compatibility E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-netapp-v41-e2e.sh "$RUN_ID"
      - name: NetApp NFSv4.1 negotiated channel limits E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-channel-limits-e2e.sh "$RUN_ID"
      - name: NetApp NFSv4.1 pNFS WRITE E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-pnfs-e2e.sh "$RUN_ID"
      - name: NetApp pNFS pre-WRITE DS failure fallback E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-pnfs-preflight-fallback-e2e.sh "$RUN_ID"
      - name: NetApp pNFS DS reset uncertain-outcome E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-pnfs-ds-reset-e2e.sh "$RUN_ID"
      - name: NetApp pNFS LAYOUTCOMMIT failure recovery E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-pnfs-layoutcommit-fault-e2e.sh "$RUN_ID"
      - name: NetApp pNFS layout recall during WRITE/CLOSE E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-pnfs-layout-recall-e2e.sh "$RUN_ID"
      - name: NFSv4.1 session recovery E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-session-recovery-e2e.sh "$RUN_ID"
      - name: NFSv4.1 TCP rebind E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-tcp-rebind-e2e.sh "$RUN_ID"
      - name: NFSv4.1 callback reply-loss scripted fault
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-callback-replay-e2e.sh
      - name: NFSv4.1 real knfsd callback reply-loss E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-real-callback-replay-e2e.sh "$RUN_ID"
      - name: Public Python API conformance on every real protocol
        run: |
          mkdir -p "$RUNNER_TEMP/python-api-conformance"
          flock --wait 10800 /tmp/terrasync-lab-tests.lock \
            tests/lab/run-python-api-conformance.sh "$RUN_ID" \
            "$RUNNER_TEMP/python-api-conformance/results.json"
      - name: Upload Python API conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-api-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-api-conformance
      - name: Upload reliability coverage manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfs41-reliability-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/nfs41-reliability-coverage.json
      - name: Restore NetApp pNFS DS connectivity
        if: always()
        run: sudo -n /usr/local/sbin/nfsrs-lab-pnfs-fault restore-ds "$RUN_ID"
      - name: Restore NetApp NFSv4.0 connectivity
        if: always()
        run: tests/lab/verify-netapp-v40-cleanup.sh "$RUN_ID"
      - name: Cleanup NetApp pNFS run
        if: always()
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/cleanup-pnfs-run.sh "$RUN_ID"
      - name: Cleanup
        if: always()
        run: tests/lab/cleanup-run.sh "$RUN_ID"
