name: Release validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to validate
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: terrasync-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, linux, x64, terrasync-lab, nfs-rs]
    environment: release
    timeout-minutes: 240
    env:
      RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Allocate unique NFSv4.0 evidence directory
        run: echo "NFS_RS_LAB_V40_EVIDENCE_DIR=$RUNNER_TEMP/nfsv40-evidence-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Discover persisted Rust toolchain
        run: |
          toolchain_bin=""
          for candidate in \
            "${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.95.0-x86_64-unknown-linux-gnu/bin" \
            "/home/github-runner/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu/bin" \
            "/opt/rust/1.95.0/bin"; do
            if [[ -x "$candidate/rustc" && -x "$candidate/cargo" ]]; then
              toolchain_bin="$candidate"
              break
            fi
          done
          if [[ -z "$toolchain_bin" ]]; then
            echo "complete pre-provisioned Rust 1.95.0 toolchain not found" >&2
            exit 1
          fi
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          echo "using pre-provisioned toolchain at $toolchain_bin"
      - name: Use pre-provisioned Rust 1.95.0
        run: |
          rustc --version | grep -q '^rustc 1\.95\.0 '
          rustc --version --verbose
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.13.0"
      - run: python -m pip install "maturin>=1,<2"
      - run: tests/lab/health-check.sh
      - run: tests/lab/prepare-run.sh "$RUN_ID"
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock cargo test --all-targets --locked --no-fail-fast
      - name: Gate every real storage performance baseline
        run: tests/benchmarks/run-storage-benchmark-suite.sh gate "$RUN_ID" "$RUNNER_TEMP/storage-performance-gate"
      - name: Upload storage performance gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-performance-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-performance-gate
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-e2e.sh "$RUN_ID"
      - name: Linux kernel NFSv4.0 E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-kernel-v40-e2e.sh "$RUN_ID"
      - name: Record complete NetApp NFSv4.0 release matrix
        run: tests/lab/run-netapp-v40-release-matrix.sh "$RUN_ID" "$NFS_RS_LAB_V40_EVIDENCE_DIR"
      - name: NetApp NFSv4.1 compatibility E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-netapp-v41-e2e.sh "$RUN_ID"
      - name: NetApp NFSv4.1 pNFS compatibility E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-pnfs-e2e.sh "$RUN_ID"
      - name: Build final x86_64 Python wheel and source artifact once
        run: |
          mkdir -p target/python-release-artifacts
          maturin build --release --locked --compatibility manylinux2014 --zig --out target/python-release-artifacts
          maturin sdist --out target/python-release-artifacts
          python scripts/verify-python-artifacts.py \
            --wheel target/python-release-artifacts/*_x86_64.whl \
            --sdist target/python-release-artifacts/nfs_rs-*.tar.gz
      - name: Validate final x86_64 wheel on every required real protocol
        run: |
          python -m venv "$RUNNER_TEMP/python-wheel-venv"
          "$RUNNER_TEMP/python-wheel-venv/bin/python" -m pip install --no-deps target/python-release-artifacts/*_x86_64.whl
          mkdir -p "$RUNNER_TEMP/python-real-protocol"
          flock --wait 10800 /tmp/terrasync-lab-tests.lock env \
            PYTHON="$RUNNER_TEMP/python-wheel-venv/bin/python" \
            tests/lab/run-python-artifact-matrix.sh "$RUN_ID" wheel \
            "$RUNNER_TEMP/python-real-protocol/x86_64-wheel.json"
      - name: Validate wheel rebuilt from final source artifact on every required real protocol
        run: |
          mkdir -p "$RUNNER_TEMP/python-sdist-source" "$RUNNER_TEMP/python-sdist-wheel"
          tar -xzf target/python-release-artifacts/nfs_rs-*.tar.gz -C "$RUNNER_TEMP/python-sdist-source"
          maturin build --release --locked --compatibility manylinux2014 --zig \
            --manifest-path "$RUNNER_TEMP"/python-sdist-source/nfs_rs-*/Cargo.toml \
            --out "$RUNNER_TEMP/python-sdist-wheel"
          python -m venv "$RUNNER_TEMP/python-sdist-venv"
          "$RUNNER_TEMP/python-sdist-venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/python-sdist-wheel/*.whl
          flock --wait 10800 /tmp/terrasync-lab-tests.lock env \
            PYTHON="$RUNNER_TEMP/python-sdist-venv/bin/python" \
            tests/lab/run-python-artifact-matrix.sh "$RUN_ID" sdist-wheel \
            "$RUNNER_TEMP/python-real-protocol/x86_64-sdist-wheel.json"
      - name: Upload Python real-protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-real-protocol-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-real-protocol
      - run: cargo build --release --locked
      - run: cargo package --locked
      - run: cargo publish --locked --dry-run
      - run: tests/lab/collect-nfsv40-release-evidence.sh "$RUN_ID" release-evidence
      - name: Checksums
        run: find target/release -maxdepth 1 -type f -executable -print0 | sort -z | xargs -0r sha256sum | tee release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nfs-rs-release-validation-${{ github.run_id }}
          path: |
            release-sha256.txt
            release-evidence
      - name: Cleanup
        if: always()
        run: |
          tests/lab/verify-netapp-v40-cleanup.sh "$RUN_ID"
          tests/lab/cleanup-run.sh "$RUN_ID"

  aarch64-python-real-protocol:
    needs: release
    runs-on: [self-hosted, linux, ARM64, terrasync-lab, nfs-rs]
    environment: release
    timeout-minutes: 120
    env:
      RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Discover persisted aarch64 Rust toolchain
        run: |
          toolchain_bin=""
          for candidate in \
            "${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.95.0-aarch64-unknown-linux-gnu/bin" \
            "/home/github-runner/.rustup/toolchains/1.95.0-aarch64-unknown-linux-gnu/bin" \
            "/opt/rust/1.95.0/bin"; do
            if [[ -x "$candidate/rustc" && -x "$candidate/cargo" ]]; then
              toolchain_bin="$candidate"
              break
            fi
          done
          if [[ -z "$toolchain_bin" ]]; then
            echo "complete pre-provisioned aarch64 Rust 1.95.0 toolchain not found" >&2
            exit 1
          fi
          echo "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Use pre-provisioned aarch64 Rust 1.95.0
        run: |
          rustc --version | grep -q '^rustc 1\.95\.0 '
          [[ "$(rustc --version --verbose | sed -n 's/^host: //p')" == aarch64-unknown-linux-gnu ]]
          cargo --version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.13.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: python -m pip install "maturin>=1,<2"
      - run: tests/lab/health-check.sh
      - run: tests/lab/prepare-run.sh "$RUN_ID"
      - name: Build, install, and verify the final aarch64 wheel
        run: |
          mkdir -p target/python-release-artifacts "$RUNNER_TEMP/python-real-protocol"
          maturin build --release --locked --compatibility manylinux2014 --zig --out target/python-release-artifacts
          python scripts/verify-python-artifacts.py --wheel target/python-release-artifacts/*_aarch64.whl
          python -m venv "$RUNNER_TEMP/python-arm64-venv"
          "$RUNNER_TEMP/python-arm64-venv/bin/python" -m pip install --no-deps target/python-release-artifacts/*_aarch64.whl
          flock --wait 10800 /tmp/terrasync-lab-tests.lock env \
            PYTHON="$RUNNER_TEMP/python-arm64-venv/bin/python" \
            tests/lab/run-python-artifact-matrix.sh "$RUN_ID" wheel \
            "$RUNNER_TEMP/python-real-protocol/aarch64-wheel.json" smoke
      - name: Upload aarch64 Python real-protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-real-protocol-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-real-protocol
      - name: Cleanup
        if: always()
        run: tests/lab/cleanup-run.sh "$RUN_ID"
