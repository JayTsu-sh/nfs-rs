[package]
name = "nfs-rs"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byteorder = "1.5.0"
bytes = "1.10.1"
futures = "0.3.31"
nix = "0.29.0"
path-clean = "1.0.1"
rand = "0.9.1"
thiserror = "2.0.12"
url = "2.5.4"
tokio = { version = "1.35.1", features = ["net", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
async-trait = "0.1.77"
socket2 = { version = "0.5", features = ["all"] }

[build-dependencies]
fastxdr = "=1.0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "xdr_decode"
harness = false
