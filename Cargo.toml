[package]
name = "nfs-rs"
version = "0.6.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "An asynchronous pure Rust client library for NFSv3, experimental NFSv4.0, and NFSv4.1"
repository = "https://github.com/JayTsu-sh/nfs-rs"
documentation = "https://docs.rs/nfs-rs"
readme = "README.md"
keywords = ["nfs", "nfs3", "nfs4", "filesystem", "async"]
categories = ["filesystem", "network-programming", "asynchronous"]
publish = ["crates-io"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/build.rs",
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/tests/lab_e2e.rs",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python-bindings = ["dep:pyo3", "dep:pyo3-async-runtimes"]
python-extension = ["python-bindings", "pyo3/extension-module"]
python-test-support = ["python-extension"]

[dependencies]
byteorder = "1.5.0"
bytes = "1.10.1"
futures = "0.3.31"
nix = "0.29.0"
path-clean = "1.0.1"
rand = "0.9.1"
serde_json = "1.0"
thiserror = "2.0.12"
url = "2.5.4"
tokio = { version = "1.35.1", features = ["net", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
async-trait = "0.1.77"
socket2 = { version = "0.5", features = ["all"] }
pyo3 = { version = "0.29", features = ["abi3-py311"], optional = true }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"], optional = true }

[build-dependencies]
fastxdr = "=1.0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "xdr_decode"
harness = false
